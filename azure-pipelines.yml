trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: aksdemoregistrygreen231
  imageName: user-service
  tag: $(Build.BuildId)
  resourceGroup: project_rg
  aksCluster: aks-demo-cluster

stages:

# =========================================
# ✅ STAGE 1: BUILD & PUSH IMAGE
# =========================================
- stage: Build
  displayName: "Build & Push Docker Image"
  jobs:
  - job: BuildImage
    steps:

    - task: AzureCLI@2
      displayName: Login to ACR + Build + Push
      inputs:
        azureSubscription: 'AZURE-SERVICE-CONNECTION'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logging into ACR..."
          az acr login --name $(acrName)

          echo "Building Docker image..."
          docker build -t $(acrName).azurecr.io/$(imageName):$(tag) -f services/user-service/Dockerfile services/user-service

          echo "Pushing Docker image..."
          docker push $(acrName).azurecr.io/$(imageName):$(tag)

# =========================================
# ✅ STAGE 2: DEPLOY TO AKS
# =========================================
- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployToAKS
    steps:

    # ✅ Login to AKS
    - task: Kubernetes@1
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'AZURE-SERVICE-CONNECTION'
        azureResourceGroup: $(resourceGroup)
        kubernetesCluster: $(aksCluster)
        command: login

    # ✅ Install Helm
    - task: HelmInstaller@1
      inputs:
        helmVersionToInstall: latest

    # ✅ Deploy USER SERVICE
    - script: |
        helm upgrade --install user-service ./helm/user-service \
          --set image.repository=$(acrName).azurecr.io/user-service \
          --set image.tag=$(tag)
      displayName: Deploy User Service

    # ✅ Deploy GRAFANA + PROMETHEUS
    - script: |
    
        echo "Adding Helm repository..."
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

        echo "Updating repo..."
        helm repo update
        
        echo "Installing kube-prometheus-stack..."
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
          -n monitoring \
          -f grafana-values.yaml \
          --create-namespace
      displayName: Deploy Monitoring
