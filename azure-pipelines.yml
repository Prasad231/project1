trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  workingDir: terraform

stages:
- stage: Terraform
  displayName: "Terraform Infra Deployment"

  jobs:
  - job: TerraformJob
    displayName: "Run Terraform"
    steps:

    # ✅ Install Terraform (safe method)
    - script: |
        echo "Downloading Terraform..."
        wget https://releases.hashicorp.com/terraform/1.5.0/terraform_1.5.0_linux_amd64.zip -O /tmp/terraform.zip

        echo "Extracting Terraform..."
        mkdir -p /tmp/terraform-bin
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin

        chmod +x /tmp/terraform-bin/terraform

        echo "Terraform version:"
        /tmp/terraform-bin/terraform -version
      displayName: "Install Terraform"

    # ✅ Run Terraform inside AzureCLI (this solves auth issue)
    - task: AzureCLI@2
      displayName: "Run Terraform (Init + Plan + Apply)"
      inputs:
        azureSubscription: 'AZURE-SERVICE-CONNECTION'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          echo "Switching to Terraform directory..."
          cd $(workingDir)

          echo "Setting Terraform Service Principal authentication..."

          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_CLIENT_SECRET=$servicePrincipalKey
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          
          echo "Running Terraform Destroy..."
          /tmp/terraform-bin/terraform destroy -auto-approve tfplan
         #  echo "Running Terraform Init..."
         # /tmp/terraform-bin/terraform init

         #  echo "Running Terraform Plan..."
         #  /tmp/terraform-bin/terraform plan -out=tfplan

         #  echo "Running Terraform Apply..."
         #  /tmp/terraform-bin/terraform apply -auto-approve tfplan

