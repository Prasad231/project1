trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.5.0'
  workingDir: terraform

stages:
- stage: Terraform
  displayName: "Terraform Infra Deployment"

  jobs:
  - job: TerraformJob
    displayName: "Run Terraform"
    steps:

    # ✅ Install Terraform


    - script: |
          echo "Download terraform..."
          wget https://releases.hashicorp.com/terraform/1.5.0/terraform_1.5.0_linux_amd64.zip -O /tmp/terraform.zip

          echo "Extracting..."
          mkdir -p /tmp/terraform-bin
          unzip -o /tmp/terraform.zip -d /tmp/terraform-bin

          chmod +x /tmp/terraform-bin/terraform

          echo "Verify Terraform"
          /tmp/terraform-bin/terraform -version
      displayName: "Install Terraform"


    # ✅ Azure Login
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'AZURE-SERVICE-CONNECTION'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logged into Azure"

    # ✅ Init (uses your backend.tf automatically)
    - script: |
        /tmp/terraform-bin/terraform init
      workingDirectory: $(workingDir)
      displayName: "Terraform Init"

    # ✅ Plan
    - script: |
        /tmp/terraform-bin/terraform plan -out=tfplan
      workingDirectory: $(workingDir)
      displayName: "Terraform Plan"

    # ✅ Apply
    - script: |
        terraform apply -auto-approve tfplan
      workingDirectory: $(workingDir)
      displayName: "Terraform Apply" 
